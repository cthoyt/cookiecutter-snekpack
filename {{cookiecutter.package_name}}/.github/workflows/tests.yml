# This file configures the continuous integration (CI) system on GitHub.
# Introductory materials can be found here: https://docs.github.com/en/actions/learn-github-actions/understanding-github-actions.
# Documentation for editing this file can be found here: https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions

name: Tests

# by default, give the GITHUB_TOKEN no permissions
# See https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality
    permissions:
      # give only read-only access to the contents of the repository
      # this is the only permission this job requires, so keep it to the least privilege
      # i.e., not to issues, discussions, actions, etc.
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15", "3.11"]
        command: ["lint", "pyroma", "mypy"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: ${{ "{{" }} matrix.python-version {{ "}}" }}
      - name: "Run command"
        run: |
          uvx {{ cookiecutter.__runner_uv }} ${{ "{{" }} matrix.command {{ "}}" }}

  docs:
    name: Documentation
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: ${{ "{{" }} matrix.python-version {{ "}}" }}
      - name: Install dependencies
        run: |
          sudo apt-get install graphviz
      - name: Lint documentation
        run: uvx {{ cookiecutter.__runner_uv }} docs-lint
      - name: Check docstring coverage
        run: uvx {{ cookiecutter.__runner_uv }} docstr-coverage
      - name: Check documentation build with Sphinx
        run: uvx {{ cookiecutter.__runner_uv }} docs-test
      - name: Lint markdown
        run: uvx {{ cookiecutter.__runner_uv }} lint-markdown
      - name: Lint justfile
        run: uvx {{ cookiecutter.__runner_uv }} lint-justfile

  tests:
    name: Tests
    permissions:
      contents: read
    runs-on: ${{ "{{" }} matrix.os {{ "}}" }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.15", "3.11"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: "Install uv"
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
          python-version: ${{ "{{" }} matrix.python-version {{ "}}" }}
      - name: Test with pytest and generate coverage file
        run:
          uvx {{ cookiecutter.__runner_uv }} {{ cookiecutter.__runner_tests }}
      - name: Run doctests
        run:
          uvx {{ cookiecutter.__runner_uv }} doctests
      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: success()
        with:
          file: coverage.xml
